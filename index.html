<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Catálogo de Streaming</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="cabecalho">
      <h1>Catálogo de Streaming</h1>
      <p>Filmes disponíveis no Brasil</p>
    </header>

    <nav class="barra" aria-label="Filtrar por streaming">
      <div id="provedores" class="provedores"></div>
      <button id="limpar" class="limpar" hidden>Limpar</button>
    </nav>

    <main class="conteudo">
      <div id="mensagem" class="mensagem" hidden></div>
      <section id="grade" class="grade" aria-live="polite"></section>
      <button id="carregar-mais" class="carregar-mais" hidden>Carregar mais</button>
    </main>

    <footer class="rodape">
      <img src="img/tmdb.svg" alt="The Movie Database (TMDB)" class="logo-tmdb" />
      <p>Dados de streaming fornecidos por JustWatch.</p>
      <p>Este produto usa a API da TMDB, mas não é endossado ou certificado pela TMDB.</p>
    </footer>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
