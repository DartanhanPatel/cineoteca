<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>Cineoteca</title>
    <link rel="icon" type="image/svg+xml" href="img/cineoteca.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- A "luz" do filme em destaque, espalhada atrás da página. -->
    <div id="ambiente" class="ambiente" aria-hidden="true"></div>

    <header class="cabecalho">
      <h1 class="marca">
        <!-- Clicar no logo volta para a tela principal (Catálogo, no topo). -->
        <a class="marca-link" href="./" aria-label="Cineoteca, voltar para a tela principal">
          <img class="marca-icone" src="img/cineoteca.svg" alt="" />
          <!-- O nome segue uma leve curva de "sorriso", com as letras das
               pontas maiores, como um letreiro de cinema. -->
          <svg class="marca-nome" viewBox="0 0 196 48" aria-hidden="true">
            <path id="curva-marca" d="M 2 40 Q 98 50 194 40" fill="none" />
            <text>
              <textPath href="#curva-marca" textLength="192" lengthAdjust="spacingAndGlyphs">
                <tspan font-size="46">C</tspan><tspan font-size="42">I</tspan><tspan font-size="39">N</tspan><tspan font-size="37">E</tspan><tspan font-size="36">O</tspan><tspan font-size="37">T</tspan><tspan font-size="39">E</tspan><tspan font-size="42">C</tspan><tspan font-size="46">A</tspan>
              </textPath>
            </text>
          </svg>
        </a>
      </h1>

      <div class="abas" role="tablist" aria-label="O que mostrar">
        <button class="aba" role="tab" data-aba="catalogo" aria-selected="true">Catálogo</button>
        <button class="aba" role="tab" data-aba="quero" aria-selected="false">
          Quero assistir <span class="contador">0</span>
        </button>
        <button class="aba" role="tab" data-aba="assisti" aria-selected="false">
          Já assisti <span class="contador">0</span>
        </button>
      </div>

      <div class="busca" role="search">
        <input
          id="busca"
          type="search"
          placeholder="Buscar filme"
          aria-label="Buscar filme pelo título"
          autocomplete="off"
        />
        <button id="limpar-busca" class="limpar-busca" aria-label="Limpar busca" hidden>×</button>
      </div>
    </header>

    <section id="destaque" class="destaque" aria-label="Filmes em destaque" hidden></section>

    <nav class="barra" aria-label="Filtrar por streaming">
      <div id="provedores" class="provedores"></div>
      <button id="limpar" class="limpar" hidden>Limpar filtro</button>
    </nav>

    <main class="conteudo">
      <div id="mensagem" class="mensagem" hidden></div>
      <section id="grade" class="grade" aria-live="polite"></section>
      <button id="carregar-mais" class="carregar-mais" hidden>Carregar mais</button>
    </main>

    <div id="aviso" class="aviso" role="status" hidden></div>

    <footer class="rodape">
      <img src="img/tmdb.svg" alt="The Movie Database (TMDB)" class="logo-tmdb" />
      <p>Dados de streaming fornecidos por JustWatch.</p>
      <p>Este produto usa a API da TMDB, mas não é endossado ou certificado pela TMDB.</p>
    </footer>

    <!-- Página do filme: abre por cima de tudo (endereço #/filme/ID). -->
    <div
      id="detalhe"
      class="detalhe"
      role="dialog"
      aria-modal="true"
      aria-labelledby="detalhe-titulo"
      hidden
    ></div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
